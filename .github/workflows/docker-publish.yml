name: Docker

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  schedule:
    - cron: '20 8 * * *'
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
        with:
          cosign-release: 'v3.1.3'

      # Set up BuildKit Docker container builder to be able to build
      # multi-platform images and export cache
      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract FIPS Docker metadata
        id: meta-fips
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-fips

      - name: Build and push FIPS Docker image
        id: build-and-push-fips
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.fips
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-fips.outputs.tags }}
          labels: ${{ steps.meta-fips.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          # https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-an-intermediate-environment-variable
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Sign the published FIPS Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta-fips.outputs.tags }}
          DIGEST: ${{ steps.build-and-push-fips.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    env:
      COOLIFY_TAILNET_HOST: ${{ secrets.COOLIFY_TAILNET_HOST }}

    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Verify CI network boundary
        env:
          # host:port-Liste als Secret, damit Tailnet-Adressen nicht im oeffentlichen Log stehen.
          CI_BLOCKED_TARGETS: ${{ secrets.CI_BLOCKED_TARGETS }}
        run: |
          curl --fail --show-error --connect-timeout 10 \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/health"

          [ -n "$CI_BLOCKED_TARGETS" ] || { echo "Secret CI_BLOCKED_TARGETS fehlt" >&2; exit 1; }
          for target in $CI_BLOCKED_TARGETS; do
            if timeout 5 bash -c "</dev/tcp/${target%:*}/${target##*:}" 2>/dev/null; then
              echo "Unexpectedly reached a blocked target" >&2
              exit 1
            fi
          done

      - name: Deploy almond (production)
        run: |
          curl --fail --show-error --request POST \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=ysf66ufnvzl1wzxchxmhhuqu" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"

      - name: Deploy almond-fips
        run: |
          curl --fail --show-error --request POST \
            "http://${COOLIFY_TAILNET_HOST}:8000/api/v1/deploy?uuid=y5s3yaiox9usdqlao3pp3mh2" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_DEPLOY_TOKEN }}"

      # Letzter Schritt mit Absicht: der Heartbeat bestaetigt *alle* Deploys, nicht nur den ersten.
      - name: Notify Kuma (deploy heartbeat)
        if: success()
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.KUMA_BASE_URL }}/api/push/${{ secrets.KUMA_PUSH_TOKEN }}?status=up&msg=OK" \
            || echo "::warning::Kuma push failed (ACL oder Kuma nicht erreichbar); Stille-Detektion greift weiter"

  # Meldet einen kaputten Lauf sofort rot, statt ihn erst durch Stille auffallen zu lassen.
  # Eigener Job, weil ein Fehler im build-Job den deploy-Job gar nicht erst startet.
  notify-failure:
    needs: [build, deploy]
    if: failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Join Tailnet as tag:ci
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Notify Kuma (deploy failed)
        run: |
          curl --fail --silent --max-time 10 \
            "${{ secrets.KUMA_BASE_URL }}/api/push/${{ secrets.KUMA_PUSH_TOKEN }}?status=down&msg=CI%20run%20${{ github.run_id }}%20failed" \
            || echo "::warning::Kuma push failed; Stille-Detektion greift weiter"
