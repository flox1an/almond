<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Almond Configuration Editor</title>
    <!--
      frame-ancestors, sandbox and report-uri are intentionally omitted: the
      CSP spec does not let a <meta> tag enforce them, so listing them here
      would be a no-op that looks like protection. If clickjacking protection
      is wanted for the /config route, it has to be an HTTP response header
      set by the server, not this file.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-cgUpc3TbFUsy5aDp8Q59or/mOMfhz+1m3DaOKaiLFeQ='; style-src 'sha256-2Ck2tdkHtv8ccbvsbudkOXqfqcR5nTQuua4gBQFU64w='; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <style>
      /*
       * Two-tier palette: --pink is chrome (labels, borders, buttons,
       * branding) and stays fully saturated throughout. Anything the user
       * has to actually READ AT LENGTH — typed values, help text, the
       * export preview — uses --text, a near-white, deliberately
       * desaturated tone instead. Saturated magenta reads fine for short
       * bold labels but is fatiguing for paragraphs and long values on a
       * near-black background; --text fixes that without abandoning the
       * pink/black identity.
       */
      :root {
        color-scheme: dark;
        --pink: rgb(255, 73, 133);
        --pink-dim: rgba(255, 73, 133, 0.55);
        --pink-border: rgba(255, 73, 133, 0.45);
        --pink-border-dim: rgba(255, 73, 133, 0.25);
        --text: #f4eef1;
        --text-dim: rgba(244, 238, 241, 0.68);
        --text-faint: rgba(244, 238, 241, 0.4);
        --bg: #060406;
        --bg-input: #170f15;
        --bg-input-disabled: #100a0d;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Courier New", Courier, monospace;
        background: linear-gradient(to bottom, #120b10, var(--bg));
        color: var(--pink);
        padding: 20px 20px 80px;
        min-height: 100vh;
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        color: rgb(120, 210, 255);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }
      h1 {
        letter-spacing: 0.06em;
        font-size: 1.4em;
        margin-bottom: 4px;
        color: var(--pink);
      }
      .subtitle {
        color: var(--text-dim);
        margin-bottom: 20px;
        font-size: 0.9em;
      }
      .subtitle strong {
        color: var(--pink);
      }
      section {
        background: rgba(255, 73, 133, 0.05);
        border: 1px solid var(--pink-border-dim);
        border-radius: 5px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      section > h2 {
        font-size: 1.05em;
        color: rgb(255, 145, 180);
        margin-bottom: 10px;
        cursor: default;
      }
      section > h2 .count {
        color: var(--text-faint);
        font-weight: normal;
        font-size: 0.85em;
      }
      .field-category summary {
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 8px;
        color: rgb(255, 145, 180);
      }
      .field-category summary::-webkit-details-marker {
        display: none;
      }
      .field-category summary::before {
        content: "▸";
        display: inline-block;
        transition: transform 0.15s;
      }
      .field-category[open] summary::before {
        transform: rotate(90deg);
      }
      .field-category {
        border: 1px solid var(--pink-border-dim);
        border-radius: 4px;
        padding: 10px 14px;
        margin-bottom: 10px;
      }
      .field-category > .fields {
        margin-top: 12px;
      }
      .field-row {
        border-top: 1px solid rgba(255, 73, 133, 0.15);
        padding: 12px 0;
        display: grid;
        grid-template-columns: minmax(220px, 280px) 1fr;
        gap: 6px 16px;
      }
      .field-row:first-child {
        border-top: none;
      }
      .field-name {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        font-weight: bold;
        word-break: break-all;
        color: var(--pink);
      }
      .field-help {
        grid-column: 1 / -1;
        color: var(--text-dim);
        font-size: 0.85em;
      }
      .badge {
        font-size: 0.7em;
        padding: 1px 6px;
        border-radius: 3px;
        font-weight: normal;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .badge-sensitive {
        background: rgba(255, 200, 0, 0.15);
        color: rgb(255, 210, 60);
        border: 1px solid rgba(255, 200, 0, 0.4);
      }
      .badge-risk {
        background: rgba(255, 60, 60, 0.15);
        color: rgb(255, 130, 130);
        border: 1px solid rgba(255, 60, 60, 0.4);
      }
      .badge-ref {
        background: rgba(120, 210, 255, 0.15);
        color: rgb(120, 210, 255);
        border: 1px solid rgba(120, 210, 255, 0.4);
      }
      /* The one control that decides a variable's fate: checked writes the
         line, unchecked leaves it out. It sits in front of the name so a
         column of ticks reads as "what this .env actually sets". */
      .field-name input[type="checkbox"] {
        appearance: none;
        flex: 0 0 auto;
        width: 14px;
        height: 14px;
        position: relative;
        top: 2px;
        border: 1px solid var(--pink-border);
        border-radius: 3px;
        background: var(--bg-input);
        cursor: pointer;
      }
      .field-name input[type="checkbox"]:checked {
        background: var(--pink);
        border-color: var(--pink);
      }
      .field-name input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        inset: 0;
        text-align: center;
        font-size: 11px;
        line-height: 12px;
        color: #1a0510;
      }
      .field-name input[type="checkbox"]:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px rgba(255, 73, 133, 0.25);
      }
      /* An unset variable stays legible but recedes, so scanning a category
         shows at a glance which lines the .env will actually contain. */
      .field-row.is-default .var-name {
        color: var(--text-dim);
        font-weight: normal;
      }
      /* Actual entered/read content — the part of the UI this theme most
         needs to stay legible for — gets --text, not --pink. */
      .value-cell input[type="text"],
      .value-cell input[type="password"],
      .value-cell input[type="number"],
      .value-cell textarea,
      .value-cell select {
        width: 100%;
        padding: 8px 10px;
        background: var(--bg-input);
        border: 1px solid var(--pink-border);
        border-radius: 3px;
        color: var(--text);
        font-family: "Courier New", Courier, monospace;
        font-size: 0.95em;
      }
      .value-cell textarea {
        resize: vertical;
        min-height: 2.4em;
      }
      .value-cell input::placeholder,
      .value-cell textarea::placeholder,
      #import-area textarea::placeholder,
      .toolbar input::placeholder {
        color: var(--text-faint);
        opacity: 1;
      }
      /* An unset field's control is deliberately NOT `disabled`: clicking
         straight into it is how the variable gets switched on, and a
         disabled input cannot be clicked into at all. It only looks
         inactive — dimmed text and border, but a readable placeholder
         showing the default that currently applies. */
      .value-cell .inactive {
        background: var(--bg-input-disabled);
        border-color: rgba(255, 73, 133, 0.2);
        color: var(--text-faint);
      }
      .value-cell input:focus,
      .value-cell textarea:focus,
      .value-cell select:focus {
        outline: none;
        border-color: var(--pink);
        box-shadow: 0 0 0 3px rgba(255, 73, 133, 0.2);
      }
      .value-cell select option {
        background: var(--bg-input);
        color: var(--text);
      }
      .unit {
        color: var(--text-faint);
        font-size: 0.8em;
        margin-left: 6px;
      }
      .secret-row {
        display: flex;
        gap: 6px;
      }
      .secret-row input {
        flex: 1;
      }
      button.small {
        font-family: inherit;
        font-size: 0.78em;
        padding: 6px 10px;
        background: rgba(255, 73, 133, 0.15);
        border: 1px solid var(--pink);
        color: var(--pink);
        border-radius: 3px;
        cursor: pointer;
        white-space: nowrap;
      }
      button.small:hover {
        background: rgba(255, 73, 133, 0.35);
      }
      button.small:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .field-error {
        grid-column: 1 / -1;
        color: rgb(255, 130, 130);
        font-size: 0.82em;
      }
      .field-hint {
        grid-column: 1 / -1;
        color: rgb(140, 215, 255);
        font-size: 0.82em;
      }
      .ref-warning {
        grid-column: 1 / -1;
        color: rgb(140, 215, 255);
        font-size: 0.82em;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        align-items: center;
      }
      .toolbar input[type="text"],
      .toolbar select {
        padding: 8px 10px;
        background: var(--bg-input);
        border: 1px solid var(--pink-border);
        border-radius: 3px;
        color: var(--text);
        font-family: inherit;
      }
      .mode-tabs {
        display: flex;
        gap: 0;
        margin-bottom: 12px;
      }
      .mode-tabs button {
        font-family: inherit;
        padding: 8px 16px;
        background: rgba(255, 73, 133, 0.08);
        border: 1px solid var(--pink-border);
        color: var(--text-dim);
        cursor: pointer;
        font-size: 0.9em;
      }
      .mode-tabs button.active {
        background: var(--pink);
        color: #1a0510;
        font-weight: bold;
      }
      #import-area {
        display: none;
      }
      #import-area.visible {
        display: block;
      }
      #import-area textarea {
        width: 100%;
        min-height: 160px;
        background: var(--bg-input);
        color: var(--text);
        border: 1px solid var(--pink-border);
        border-radius: 3px;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.95em;
        padding: 10px;
        margin-top: 8px;
      }
      .panel-list {
        list-style: none;
      }
      .panel-list li {
        padding: 6px 0;
        border-top: 1px solid rgba(255, 73, 133, 0.15);
        font-size: 0.88em;
        color: var(--text-dim);
      }
      .panel-list li:first-child {
        border-top: none;
      }
      .risk-warn {
        color: rgb(255, 165, 110);
      }
      .risk-info {
        color: rgb(140, 215, 255);
      }
      .empty-note {
        color: var(--text-faint);
        font-style: italic;
      }
      pre#preview {
        white-space: pre-wrap;
        word-break: break-all;
        background: var(--bg-input);
        border: 1px solid var(--pink-border);
        border-radius: 3px;
        padding: 12px;
        max-height: 420px;
        overflow-y: auto;
        font-size: 0.86em;
        color: var(--text);
      }
      .export-actions {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .export-blocked {
        color: rgb(255, 130, 130);
        margin-bottom: 10px;
      }
      .secrets-warning {
        background: rgba(255, 200, 0, 0.08);
        border: 1px solid rgba(255, 200, 0, 0.4);
        color: rgb(255, 210, 60);
        padding: 10px 12px;
        border-radius: 4px;
        margin-bottom: 12px;
        font-size: 0.85em;
      }
      footer {
        text-align: center;
        color: var(--text-faint);
        font-size: 0.78em;
        margin-top: 30px;
      }
      .selftest-pass {
        color: rgb(140, 235, 140);
      }
      .selftest-fail {
        color: rgb(255, 120, 120);
      }
      .selftest-summary {
        font-size: 1.1em;
        margin-bottom: 14px;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="app"></div>
      <footer>
        Almond Configuration Editor &middot; runs entirely in this browser tab
        &middot; no network requests after load
      </footer>
    </div>

    <script>
      "use strict";

      /* ======================================================================
       * SCHEMA
       *
       * One entry per variable Config::from_map (src/config.rs) reads. This
       * table is not generated. Its correctness against config.rs is proven
       * by drift tests in src/config_editor_tests.rs, which extract the
       * literal below (between the START/END markers) and exercise
       * Config::from_map with each field's `default` and `probe` value.
       *
       * Field meaning:
       *   kind      "bool" | "number" | "string" | "path" | "socketaddr" |
       *             "url" | "list" | "list_u16" | "list_npub" | "enum" | "secret"
       *   default   literal default as config.rs would apply it, or null if
       *             there is no literal default (unset-by-default fields, or
       *             PUBLIC_URL whose default depends on ENABLE_HTTPS)
       *   empty     behaviour of Config::from_map when the var is present but
       *             empty ("KEY="):
       *               like_unset   -> same as not being set at all
       *               empty_value  -> a literal empty value, not the default
       *               hard_error   -> Almond refuses to start
       *   probe     a value that differs from the default/absence, used only
       *             to prove the field is actually wired up
       *   unit      display-only unit suffix, or null
       *   sensitive true if the value is a secret and should be masked
       *   generatable true if a "Generate" button (crypto.getRandomValues)
       *             applies to this field
       *   conditionalDefault true only for PUBLIC_URL, whose default flips
       *             with ENABLE_HTTPS (handled as a special case, not via
       *             `default`)
       *   values    allowed values for kind "enum"
       *   boolWords ["on","off"] override for the paid-feature fields, which
       *             follow .env.example's idiom even though parse_bool
       *             accepts the same true/false/1/0/on/off set everywhere
       * ==================================================================== */

      /* ALMOND_SCHEMA_JSON_START */
      const ALMOND_SCHEMA = [
        { "name": "BIND_ADDR", "category": "network", "kind": "socketaddr", "default": "127.0.0.1:3000", "empty": "hard_error", "probe": "0.0.0.0:8080", "help": "Address Almond listens on. Must be a literal IP:port \u2014 Rust's socket-address parser does not accept hostnames." },
        { "name": "PUBLIC_URL", "category": "network", "kind": "url", "default": null, "conditionalDefault": true, "empty": "empty_value", "probe": "https://blossom.example.com", "help": "Public origin used in blob descriptors. No trailing slash. Defaults to http://127.0.0.1:3000, or https://127.0.0.1:3000 when ENABLE_HTTPS is true." },
        { "name": "CORS_ALLOWED_ORIGINS", "category": "network", "kind": "list", "default": null, "empty": "like_unset", "probe": "https://app.example.com", "help": "Comma-separated exact origins allowed to read discovery and metrics responses cross-origin. Blob GET/HEAD is always public regardless of this setting." },

        { "name": "ENABLE_HTTPS", "category": "tls", "kind": "bool", "default": "false", "empty": "hard_error", "probe": "true", "help": "Set true only when Almond terminates TLS itself. Leave false behind a reverse proxy." },
        { "name": "TLS_CERT_PATH", "category": "tls", "kind": "path", "default": "./cert.pem", "empty": "empty_value", "probe": "/etc/almond/cert.pem", "help": "Certificate path, used only when ENABLE_HTTPS is true." },
        { "name": "TLS_KEY_PATH", "category": "tls", "kind": "path", "default": "./key.pem", "empty": "empty_value", "probe": "/etc/almond/key.pem", "help": "Private key path, used only when ENABLE_HTTPS is true." },
        { "name": "TLS_AUTO_GENERATE", "category": "tls", "kind": "bool", "default": "true", "empty": "hard_error", "probe": "false", "help": "Replace a missing cert/key pair with a self-signed one. Development only." },

        { "name": "STORAGE_PATH", "category": "storage", "kind": "path", "default": "./files", "empty": "empty_value", "probe": "/data/almond", "help": "Storage root. Almond creates uploads/, upstream-cache/, temp/ and quarantine/ underneath it." },

        { "name": "ALMOND_S3_ENDPOINT", "category": "s3", "kind": "url", "default": null, "empty": "like_unset", "probe": "https://s3.example.com", "help": "S3-compatible endpoint. All four ALMOND_S3_* variables must be set together, or none at all." },
        { "name": "ALMOND_S3_BUCKET", "category": "s3", "kind": "string", "default": null, "empty": "like_unset", "probe": "almond-blobs", "help": "Bucket name for native S3 storage." },
        { "name": "ALMOND_S3_ACCESS_KEY_ID", "category": "s3", "kind": "secret", "default": null, "empty": "like_unset", "probe": "AKIAEXAMPLE1234", "sensitive": true, "help": "S3 access key id." },
        { "name": "ALMOND_S3_SECRET_ACCESS_KEY", "category": "s3", "kind": "secret", "default": null, "empty": "like_unset", "probe": "exampleSecretAccessKey", "sensitive": true, "help": "S3 secret access key." },

        { "name": "SERVE_FILES_PATH", "category": "serve_files", "kind": "path", "default": null, "empty": "like_unset", "probe": "./public", "help": "Optional directory of static files served alongside blobs." },
        { "name": "SERVE_FILES_MANIFEST_NAME", "category": "serve_files", "kind": "string", "default": "manifest-sha256.txt", "empty": "empty_value", "probe": "checksums.txt", "help": "Filename of the generated SHA-256 manifest." },
        { "name": "SERVE_FILES_REFRESH_INTERVAL_SECS", "category": "serve_files", "kind": "number", "unit": "seconds", "default": "3600", "empty": "hard_error", "probe": "60", "help": "How often the static-file manifest is rebuilt." },

        { "name": "MAX_TOTAL_SIZE", "category": "limits", "kind": "number", "unit": "MiB", "default": "99999", "empty": "hard_error", "probe": "1024", "help": "Aggregate size limit across uploads and upstream-cache. The default is practically unbounded." },
        { "name": "MAX_TOTAL_FILES", "category": "limits", "kind": "number", "unit": "files", "default": "99999999", "empty": "hard_error", "probe": "10000", "help": "Aggregate completed-blob count limit. The default is practically unbounded." },
        { "name": "MAX_BLOB_SIZE_MB", "category": "limits", "kind": "number", "unit": "MiB", "default": "100", "empty": "hard_error", "probe": "50", "help": "Absolute per-blob size ceiling. MAX_CHUNK_SIZE_MB must not exceed this." },
        { "name": "MIN_FREE_DISK_MB", "category": "limits", "kind": "number", "unit": "MiB", "default": "256", "empty": "hard_error", "probe": "512", "help": "Minimum free disk space; breaching it returns HTTP 507." },
        { "name": "CLEANUP_INTERVAL_SECS", "category": "limits", "kind": "number", "unit": "seconds", "default": "30", "empty": "hard_error", "probe": "60", "min": 1, "help": "Expiry and capacity cleanup cadence. Must be greater than zero." },
        { "name": "MAX_FILE_AGE_DAYS", "category": "limits", "kind": "number", "unit": "days", "default": "0", "empty": "hard_error", "probe": "30", "help": "Age expiry for uploaded content. 0 disables age expiry entirely." },
        { "name": "MAX_UPSTREAM_CACHE_TTL_DAYS", "category": "limits", "kind": "number", "unit": "days", "default": "1", "empty": "hard_error", "probe": "7", "help": "TTL for the transparent upstream cache. 0 disables it." },
        { "name": "MAX_UPSTREAM_DOWNLOAD_SIZE_MB", "category": "limits", "kind": "number", "unit": "MiB", "default": "100", "empty": "hard_error", "probe": "500", "help": "Maximum body accepted from one transparent upstream fetch." },
        { "name": "MAX_CHUNK_SIZE_MB", "category": "limits", "kind": "number", "unit": "MiB", "default": "100", "empty": "hard_error", "probe": "50", "help": "Resumable-upload chunk ceiling. Must not exceed MAX_BLOB_SIZE_MB." },
        { "name": "CHUNK_CLEANUP_TIMEOUT_MINUTES", "category": "limits", "kind": "number", "unit": "minutes", "default": "30", "empty": "hard_error", "probe": "15", "help": "Abandoned chunked-upload sessions are cleaned up after this long." },
        { "name": "MAX_CHUNK_UPLOAD_SESSIONS", "category": "limits", "kind": "number", "unit": "sessions", "default": "128", "empty": "hard_error", "probe": "64", "help": "Global cap on concurrent chunked-upload sessions." },
        { "name": "MAX_CHUNK_UPLOAD_SESSIONS_PER_PUBKEY", "category": "limits", "kind": "number", "unit": "sessions/pubkey", "default": "8", "empty": "hard_error", "probe": "4", "help": "Per-pubkey cap on concurrent chunked-upload sessions." },
        { "name": "HLS_MIRROR_CONCURRENCY", "category": "limits", "kind": "number", "unit": "parallel fetches", "default": "4", "empty": "hard_error", "probe": "2", "help": "Parallel segment fetches for an explicit HLS mirror." },

        { "name": "UPSTREAM_SERVERS", "category": "upstream", "kind": "list", "default": null, "empty": "like_unset", "probe": "https://cdn.satellite.earth", "help": "Comma-separated trusted upstream Blossom origins. Leave unset to disable this source." },
        { "name": "UPSTREAM_MODE", "category": "upstream", "kind": "enum", "values": ["proxy", "redirect", "redirect_and_cache"], "default": "proxy", "empty": "like_unset", "probe": "redirect", "help": "proxy streams while caching; redirect returns 302; redirect_and_cache returns 302 and fills the cache in the background. Almond silently falls back to proxy on an unrecognized value \u2014 this editor rejects it instead." },

        { "name": "FEATURE_UPLOAD_ENABLED", "category": "features", "kind": "enum", "values": ["off", "wot", "dvm", "public"], "default": "public", "empty": "like_unset", "probe": "wot", "help": "Almond silently falls back to public on an unrecognized value \u2014 this editor rejects it instead." },
        { "name": "FEATURE_MIRROR_ENABLED", "category": "features", "kind": "enum", "values": ["off", "wot", "dvm", "public"], "default": "public", "empty": "like_unset", "probe": "wot", "help": "Almond silently falls back to public on an unrecognized value \u2014 this editor rejects it instead." },
        { "name": "FEATURE_LIST_ENABLED", "category": "features", "kind": "bool", "default": "true", "empty": "hard_error", "probe": "false", "help": "/list endpoint. Unlike the other FEATURE_* flags this is a plain boolean, not a mode." },
        { "name": "FEATURE_CUSTOM_UPSTREAM_ORIGIN_ENABLED", "category": "features", "kind": "enum", "values": ["off", "wot", "dvm", "public"], "default": "off", "empty": "like_unset", "probe": "wot", "help": "Allows an authorized request to supply a custom upstream origin." },
        { "name": "FEATURE_HOMEPAGE_ENABLED", "category": "features", "kind": "bool", "default": "true", "empty": "hard_error", "probe": "false", "help": "Controls the homepage. This editor is served by Almond on the same flag \u2014 disabling it also disables the /config route on that server." },
        { "name": "FEATURE_P2P_SERVE_ENABLED", "category": "features", "kind": "bool", "default": "false", "empty": "hard_error", "probe": "true", "help": "Enable Hashtree P2P serving of hashes already local to Almond." },

        { "name": "P2P_NSEC", "category": "p2p", "kind": "secret", "default": null, "empty": "like_unset", "probe": "nsec1exampleexampleexampleexampleexampleexampleexampleexamz3k5", "sensitive": true, "help": "Nostr private key (bech32 nsec) identifying this P2P node. Not generated here \u2014 it needs a real secp256k1 keypair; use a dedicated Nostr key tool." },
