# Almond on the FIPS mesh, as a pod of three containers:
#   pause  owns the network namespace and publishes the ports; it does nothing else
#   fips   joins it with NET_ADMIN and the TUN device, holds the node key
#   almond joins it with the standard image: no capabilities, UID 10001
# Because neither fips nor almond owns the namespace, a FIPS crash or restart
# never takes Almond's network down.
#
#   cp .env.fips.example .env.fips
#   docker compose --env-file .env.fips -f docker-compose.fips.yml up -d
services:
  pause:
    image: registry.k8s.io/pause:3.10
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
    ports:
      - "3000:3000"
      - "2121:2121/udp"

  fips:
    image: ghcr.io/flox1an/almond-fips:main
    network_mode: service:pause
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      FIPS_RUN_ALMOND: "false"
      FIPS_NSEC: ${FIPS_NSEC:?set FIPS_NSEC}
      FIPS_PEER_NPUB: ${FIPS_PEER_NPUB:-}
      FIPS_PEER_ADDR: ${FIPS_PEER_ADDR:-}
      FIPS_PEER_ALIAS: ${FIPS_PEER_ALIAS:-gateway}
      FIPS_PEER_TRANSPORT: ${FIPS_PEER_TRANSPORT:-udp}
      FIPS_PEERS: ${FIPS_PEERS:-}
      FIPS_HOSTS: ${FIPS_HOSTS:-}

  almond:
    image: ghcr.io/flox1an/almond:main
    network_mode: service:pause
    restart: unless-stopped
    depends_on:
      - fips
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # IPv6 wildcard: mesh peers arrive over fips0, which has no IPv4 address.
      ALMOND_BIND_ADDR: "[::]:3000"
      ALMOND_PUBLIC_URL: ${ALMOND_PUBLIC_URL:?set ALMOND_PUBLIC_URL}
      ALMOND_UPSTREAM_MODE: ${ALMOND_UPSTREAM_MODE:-proxy}
      ALMOND_UPSTREAM_SERVERS: ${ALMOND_UPSTREAM_SERVERS:-}
    volumes:
      - almond-files:/app/files

volumes:
  almond-files:
