<!DOCTYPE html>
<html>
<head>
    <title>MessagePack Simple Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@3.0.0/dist.es5+umd/msgpack.min.js"></script>
</head>
<body>
    <h1>MessagePack Test</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');

        function log(msg) {
            console.log(msg);
            output.innerHTML += msg + '<br>';
        }

        log('1. Testing MessagePack availability...');
        log('typeof MessagePack: ' + typeof MessagePack);
        log('typeof MessagePack?.decode: ' + typeof MessagePack?.decode);

        if (typeof MessagePack === 'undefined') {
            log('ERROR: MessagePack not loaded!');
        } else {
            log('✓ MessagePack loaded successfully');

            // Test with real filter data
            const base64Data = "lc+RCi3siQJcwQgHCNwAGM2sDc0qQc01Nc1Vfc3eOc3TL80tqs2Mk83S6M0GKs0Fgc3sZs1kuc3DLs3v0s0C+c1ADc1h3s04+s027c1np83H7M02683tyA==";

            log('2. Decoding base64...');
            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            log('✓ Binary data prepared (' + bytes.length + ' bytes)');

            log('3. Deserializing MessagePack...');
            try {
                const data = MessagePack.decode(bytes);
                log('✓ MessagePack.decode successful!');
                log('Type: ' + (Array.isArray(data) ? 'Array' : typeof data));
                log('Length: ' + data.length);
                log('Structure:');
                data.forEach((item, i) => {
                    if (Array.isArray(item)) {
                        log(`  [${i}]: Array(${item.length} items)`);
                    } else {
                        log(`  [${i}]: ${item}`);
                    }
                });
            } catch (e) {
                log('ERROR: ' + e.message);
                log('Stack: ' + e.stack);
            }
        }
    </script>
</body>
</html>
