[package]
name = "almond"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "inspect_filter"
path = "src/bin/inspect_filter.rs"

[[bin]]
name = "analyze_reports"
path = "src/bin/analyze_reports.rs"

[dependencies]
axum = "0.8.9"
headers = "0.4.1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7.18", features = ["io"] }
regex = "1"
once_cell = "1.21"
mime_guess = "2.0.5"
futures-util = "0.3.32"
sha2 = "0.11.0"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate"] }
hyper = "1.9.0"
dotenvy = "0.15.7"
uuid = { version = "1.23.1", features = ["v4"] }
base64 = "0.22.1"
hex = "0.4"
nostr = "0.44.3"
nostr-relay-pool = "0.44.1"
chrono = "0.4.44"
tokio-stream = "0.1"
bytes = "1"
async-stream = "0.3"
async-trait = "0.1"
bloomfilter = "3.0"
xorf = { version = "0.12", features = ["serde"] }
rmp-serde = "1.3"
serde_urlencoded = "0.7.1"
axum-extra = { version = "0.12.6", features = ["query"] }
serde_html_form = "0.4.0"
prometheus = "0.14"
fs2 = "0.4"
rmp = "0.8.15"

# Cashu payment support (BUD-07)
cdk = { version = "0.16", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.16", features = ["wallet"] }
cashu = "0.16"
rand = "0.10"

# Hashtree P2P serving support
hashtree-core = "0.2.15"
hashtree-webrtc = "0.2.15"
nostr-sdk = "0.35"

# HTTPS/TLS support
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
rustls-pemfile = "2.2"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
