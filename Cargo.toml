[package]
name = "almond"
version = "0.4.2"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "inspect_filter"
path = "src/bin/inspect_filter.rs"

[[bin]]
name = "analyze_reports"
path = "src/bin/analyze_reports.rs"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.11", features = ["limit", "timeout"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
regex = "1"
mime_guess = "2.0.5"
futures-util = "0.3.32"
sha2 = "0.11.0"
reqwest = { version = "0.13", features = ["json", "stream", "gzip", "brotli", "deflate"] }
dotenvy = "0.15.7"
uuid = { version = "1.23.1", features = ["v4"] }
base64 = "0.22.1"
hex = "0.4"
nostr = "0.44.3"
nostr-relay-pool = "0.44.1"
chrono = "0.4.44"
bytes = "1"
async-stream = "0.3"
async-trait = "0.1"
bloomfilter = "3.0"
xorf = { version = "0.12", features = ["serde"] }
rmp-serde = "1.3"
axum-extra = { version = "0.12.6", features = ["query"] }
prometheus = "0.14"
fs2 = "0.4"
rmp = "0.8.15"
aws-config = { version = "1.8", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
aws-sdk-s3 = "1.137"

# Global allocator: glibc malloc degrades badly under many concurrent
# streaming responses (one BytesMut per chunk per connection).
mimalloc = { version = "0.1", default-features = false }

# Cashu payment support (BUD-07)
cdk = { version = "0.16", default-features = false, features = ["wallet"] }
cdk-sqlite = { version = "0.16", features = ["wallet"] }
cashu = "0.16"
rand = "0.10"

# Hashtree P2P serving support
hashtree-core = "0.2.87"
hashtree-webrtc = "0.2.15"
nostr-sdk = "0.35"

# HTTPS/TLS support
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
rustls-pemfile = "2.2"
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[profile.release]
# Whole-program inlining across crate boundaries; the hot path spans
# axum -> hyper -> tokio-util -> tokio and benefits directly.
lto = "fat"
codegen-units = 1
# NOTE: deliberately NOT setting panic = "abort". Handlers are not wrapped in
# CatchPanicLayer, so aborting would turn a single bad request into a full
# node outage.

[lints.rust]
unsafe_code = "forbid"
# Zero `unsafe` in src/ — lock that in for free.
unused_qualifications = "warn"
# Would have caught dead handlers.
unreachable_pub = "warn"
unused_lifetimes = "warn"

[lints.clippy]
# Keep the CI baseline actionable. Pedantic is intentionally not enabled
# wholesale: it reports style preferences in existing production paths that
# are not correctness defects.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
# Flag discarded JoinHandles and similar must-use values.
let_underscore_must_use = "warn"
redundant_clone = "warn"
# Deliberately not enforcing across 500+ tracing calls
uninlined_format_args = "allow"
# All panics are boot-only — revisit once Config::from_env lands
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[dev-dependencies]
serde_html_form = "0.4.0"
